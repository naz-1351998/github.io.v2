<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: #0a0a0a;
    color: #fff;
  }
  .page { display: none; min-height: 100vh; position: relative; overflow: hidden; }
  .page.active { display: flex; }

  /* ===== PAGE 1 ===== */
  #page1 {
    background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #1a0a2e 100%);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  .stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

  .hearts-float { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .heart-float {
    position: absolute;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-100vh) rotate(360deg); }
  }

  #page1 .welcome-text {
    font-size: clamp(2.4rem, 13vw, 7rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #fff;
    white-space: nowrap;
    animation: pulse-glow 2s ease-in-out infinite alternate;
    z-index: 1;
    position: relative;
    width: 100%;
    text-align: center;
  }
  @keyframes pulse-glow {
    from { text-shadow: 0 0 30px rgba(255,180,220,0.6), 0 0 60px rgba(200,100,200,0.3); }
    to   { text-shadow: 0 0 60px rgba(255,180,220,1),   0 0 120px rgba(200,100,200,0.7); }
  }

  #page1 .tagline {
    font-size: clamp(0.85rem, 3.5vw, 1.1rem);
    font-style: italic;
    color: rgba(255,180,220,0.7);
    margin-top: 0.6rem;
    letter-spacing: 0.06em;
    z-index: 1;
    position: relative;
  }

  .continue-btn {
    margin-top: 2.5rem;
    display: inline-block;
    padding: 0.85rem 2rem;
    border: 2px solid rgba(255,180,220,0.7);
    border-radius: 50px;
    color: #ffb4dc;
    font-size: clamp(0.75rem, 3vw, 1rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    background: rgba(255,180,220,0.08);
    backdrop-filter: blur(4px);
    transition: all 0.3s;
    z-index: 1;
    position: relative;
    animation: border-pulse 2s ease-in-out infinite;
    font-family: Georgia, serif;
    white-space: nowrap;
  }
  .continue-btn:hover {
    background: rgba(255,180,220,0.2);
    border-color: #ffb4dc;
    transform: scale(1.05);
  }
  @keyframes border-pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255,180,220,0.2); }
    50%        { box-shadow: 0 0 25px rgba(255,180,220,0.5); }
  }

  .music-note {
    position: absolute; top: 1.2rem; right: 1.5rem;
    font-size: 1.8rem; cursor: pointer; z-index: 10;
    animation: bounce 1s ease-in-out infinite alternate;
  }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .music-label {
    position: absolute; top: 1rem; right: 4rem;
    font-size: 0.65rem; color: rgba(255,180,220,0.7);
    letter-spacing: 0.05em; z-index: 10;
  }

  /* ===== PAGE 2 ===== */
  #page2 {
    background: linear-gradient(160deg, #0d0025 0%, #1e0040 50%, #0d0025 100%);
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 6rem;
    text-align: center;
  }

    color: #ffb4dc;
    text-shadow: 0 0 30px rgba(255,100,
